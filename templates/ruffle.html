<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title id="pageTitle">Empires &amp; Allies</title>
	<link rel="shortcut icon" href="img/icon.png"/>
	<link rel="icon" type="image/png" href="img/icon.png"/>

	<!-- Self-hosted Ruffle 0.8.0 (templates/js/ruffle/). Pinned on purpose: the
	     old unpkg URL pulled whatever was newest at page load, needed internet,
	     and ran third-party code from a CDN. -->
	<script src="{{ asset_url('js/ruffle/ruffle.js') }}"></script>
	<script src="{{ asset_url('js/flash.js') }}"></script>
	<script src="{{ asset_url('js/session.js') }}"></script>
	<script src="{{ asset_url('js/empires.js') }}"></script>
	<script>
		// Called by the SWF through ExternalInterface. Keep these names.
		function getUserInfo() {
			console.log("getUserInfo called");
			inner_getUserInfo();
			return {
				'zid': {{ zid | default(-1000) }},
				'uid': {{ zid | default(-1000) }},
				'first_name': {{ worldname | tojson }},
				'name': {{ worldname | tojson }},
				"sex": 'F',
				'pic_square': '{{ picture }}'
			};
		}

		function getFriendData() {
			console.log("getFriendData called");
			inner_getFriendData();
			return {{ allies | safe | default([]) }};
		}

		function getAppFriendIds() {
			console.log("getAppFriendIds called");
			inner_getAppFriendIds();
			return {{ app_friends | safe | default([]) }};
		}

		function onGameLoaded(seen, popp, canvas) {
			console.log("Game is loaded " + seen + ", " + popp + ", " + canvas)
			inner_onGameLoaded();
			return;
		}
	</script>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background: #10121a;
			font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: #e6e8eb;
		}

		/* The stage is 1000x750; Ruffle scales it to the window and letterboxes. */
		#game_object, #ruffle, #ruffle > * {
			width: 100%;
			height: 100%;
			display: block;
		}

		#game_object {
			position: fixed;
			inset: 0;
			background: #10121a;
		}

		/* Side-docked glassmorphic profile/menu handle (right edge, clear of top HUD). */
		#menu-toggle {
			position: fixed;
			top: 50%;
			right: 0;
			transform: translate(4px, -50%);
			z-index: 25;
			padding: 8px 12px 8px 10px;
			border-radius: 999px 0 0 999px;
			border: 1px solid rgba(255, 255, 255, .16);
			border-right: 0;
			background: rgba(18, 22, 32, .9);
			color: #f0f3f8;
			font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
			box-shadow: -6px 6px 20px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .08);
			transition: transform .18s ease, background .18s ease, border-color .18s ease;
		}
		#menu-toggle:hover {
			transform: translate(0, -50%);
			background: rgba(26, 31, 45, .96);
			border-color: rgba(122, 154, 214, .75);
		}
		#menu-toggle .chev { color: #9aa5b5; font-size: 14px; line-height: 1; }
		#menu-toggle .ava {
			width: 24px;
			height: 24px;
			border-radius: 50%;
			object-fit: cover;
			border: 1.5px solid rgba(230, 177, 4, .75);
			background: #232838;
		}

		#drawer-backdrop {
			position: fixed;
			inset: 0;
			z-index: 29;
			background: rgba(8, 10, 16, .55);
			backdrop-filter: blur(3px);
			opacity: 0;
			pointer-events: none;
			transition: opacity .22s ease;
		}
		#drawer-backdrop.open { opacity: 1; pointer-events: auto; }

		#drawer {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			width: 300px;
			max-width: 90vw;
			z-index: 30;
			background: rgba(16, 19, 28, .95);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border-left: 1px solid rgba(255, 255, 255, .12);
			box-shadow: -12px 0 36px rgba(0, 0, 0, .55);
			padding: 20px 18px;
			display: flex;
			flex-direction: column;
			gap: 16px;
			transform: translateX(100%);
			transition: transform .24s cubic-bezier(.22, 1, .36, 1);
			color: #e6e8eb;
			font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		#drawer.open { transform: translateX(0); }

		.drawer-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding-bottom: 14px;
			border-bottom: 1px solid rgba(255, 255, 255, .1);
		}
		.drawer-profile { display: flex; align-items: center; gap: 11px; min-width: 0; }
		.drawer-profile img {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			object-fit: cover;
			border: 2px solid rgba(230, 177, 4, .8);
			background: #232838;
			flex: 0 0 auto;
		}
		.drawer-profile .who { display: flex; flex-direction: column; min-width: 0; }
		.drawer-profile .who b { color: #fff; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.drawer-profile .who span { color: #e6b104; font-size: 12px; font-weight: 600; }
		#drawer-close {
			background: rgba(255, 255, 255, .05);
			border: 1px solid rgba(255, 255, 255, .12);
			color: #aab1ba;
			border-radius: 8px;
			width: 30px;
			height: 30px;
			cursor: pointer;
			font-size: 16px;
			flex: 0 0 auto;
		}
		#drawer-close:hover { color: #fff; border-color: #7a9ad6; background: rgba(255, 255, 255, .1); }

		.drawer-stats {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
		}
		.stat-box {
			background: rgba(255, 255, 255, .04);
			border: 1px solid rgba(255, 255, 255, .07);
			border-radius: 8px;
			padding: 8px 10px;
		}
		.stat-box .k { display: block; font-size: 11px; color: #8c95a3; text-transform: uppercase; letter-spacing: .04em; }
		.stat-box .v { display: block; font-size: 14px; font-weight: 600; color: #f0f3f8; font-variant-numeric: tabular-nums; margin-top: 2px; }

		.drawer-actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 7px;
			margin-top: auto;
		}
		.drawer-actions a, .drawer-actions button {
			font: inherit;
			font-size: 12px;
			font-weight: 500;
			text-align: left;
			color: #e6e8eb;
			background: rgba(255, 255, 255, .05);
			border: 1px solid rgba(255, 255, 255, .1);
			border-radius: 8px;
			padding: 8px 10px;
			text-decoration: none;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 4px;
			min-width: 0;
			white-space: nowrap;
			transition: background .15s ease, border-color .15s ease;
		}
		.drawer-actions a:hover, .drawer-actions button:hover { background: rgba(122, 154, 214, .14); border-color: rgba(122, 154, 214, .55); color: #fff; }
		.drawer-actions a.logout { background: rgba(224, 112, 112, .08); border-color: rgba(224, 112, 112, .3); color: #f5a3a3; }
		.drawer-actions a.logout:hover { background: rgba(224, 112, 112, .18); border-color: #e07070; color: #ffd6d6; }

		.chat-box {
			flex: 1 1 auto;
			min-height: 140px;
			display: flex;
			flex-direction: column;
			background: rgba(255, 255, 255, .03);
			border: 1px solid rgba(255, 255, 255, .08);
			border-radius: 10px;
			overflow: hidden;
		}
		.chat-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 7px 10px;
			border-bottom: 1px solid rgba(255, 255, 255, .08);
			font-size: 11.5px;
			font-weight: 600;
			color: #aab1ba;
			text-transform: uppercase;
			letter-spacing: .04em;
		}
		.chat-drop-btn {
			background: rgba(230, 177, 4, .16);
			border: 1px solid rgba(230, 177, 4, .45);
			color: #f4cf58;
			border-radius: 6px;
			padding: 2px 7px;
			font-size: 11px;
			cursor: pointer;
		}
		#chat-drop-form {
			display: none;
			padding: 8px;
			border-bottom: 1px solid rgba(255, 255, 255, .08);
			background: rgba(0, 0, 0, .25);
			gap: 5px;
			flex-wrap: wrap;
		}
		#chat-drop-form.open { display: flex; }
		#chat-drop-form input {
			width: calc(50% - 3px);
			padding: 4px 6px;
			font-size: 11.5px;
			border-radius: 5px;
			border: 1px solid rgba(255, 255, 255, .14);
			background: rgba(16, 19, 28, .9);
			color: #fff;
		}
		#chat-drop-send {
			width: 100%;
			padding: 5px;
			font-size: 12px;
			font-weight: 600;
			border-radius: 5px;
			border: 1px solid rgba(230, 177, 4, .6);
			background: rgba(230, 177, 4, .22);
			color: #ffe285;
			cursor: pointer;
		}
		#chat-list {
			flex: 1 1 auto;
			overflow-y: auto;
			padding: 8px 10px;
			display: flex;
			flex-direction: column;
			gap: 7px;
			font-size: 12.5px;
		}
		.chat-msg { line-height: 1.35; word-break: break-word; color: #dbe1ea; }
		.chat-msg .meta { font-size: 11px; color: #7f8896; margin-right: 4px; }
		.chat-msg .who { font-weight: 600; color: #fff; }
		.chat-msg .tag-adm {
			display: inline-block;
			font-size: 9.5px;
			padding: 1px 4px;
			border-radius: 4px;
			background: rgba(230, 177, 4, .2);
			color: #f4cf58;
			margin-right: 4px;
			vertical-align: middle;
		}
		.drop-card {
			margin-top: 4px;
			padding: 7px 9px;
			border-radius: 7px;
			background: rgba(230, 177, 4, .1);
			border: 1px solid rgba(230, 177, 4, .35);
		}
		.drop-card .sum { font-size: 12px; font-weight: 600; color: #ffe285; }
		.drop-card .claim-row { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; gap: 6px; }
		.drop-card .cnt { font-size: 11px; color: #c7b889; }
		.drop-card button {
			padding: 3px 9px;
			font-size: 11.5px;
			font-weight: 600;
			border-radius: 5px;
			border: 1px solid rgba(108, 192, 131, .55);
			background: rgba(108, 192, 131, .2);
			color: #9be8b0;
			cursor: pointer;
		}
		.drop-card button:disabled {
			opacity: .55;
			cursor: default;
			border-color: rgba(255, 255, 255, .15);
			background: rgba(255, 255, 255, .05);
			color: #9aa1aa;
		}
		.chat-input {
			display: flex;
			gap: 6px;
			padding: 7px;
			border-top: 1px solid rgba(255, 255, 255, .08);
		}
		.chat-input input {
			flex: 1 1 auto;
			min-width: 0;
			padding: 6px 8px;
			border-radius: 6px;
			border: 1px solid rgba(255, 255, 255, .14);
			background: rgba(0, 0, 0, .28);
			color: #fff;
			font: inherit;
			font-size: 12.5px;
		}
		.chat-input button {
			padding: 6px 10px;
			border-radius: 6px;
			border: 1px solid rgba(122, 154, 214, .5);
			background: rgba(122, 154, 214, .2);
			color: #dce6f9;
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
		}

		#ticket-modal, #friends-modal {
			position: fixed;
			inset: 0;
			z-index: 45;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(8, 10, 16, .65);
			backdrop-filter: blur(4px);
			padding: 16px;
		}
		#ticket-modal.open, #friends-modal.open { display: flex; }
		.f-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; font-size: 12.5px; }
		.f-acts { display: flex; gap: 6px; }
		.f-acts button { padding: 3px 9px; font-size: 11.5px; border-radius: 6px; border: 1px solid rgba(108,192,131,.5); background: rgba(108,192,131,.18); color: #9be8b0; cursor: pointer; }
		.f-acts button.del { border-color: rgba(224,112,112,.45); background: rgba(224,112,112,.14); color: #f5a3a3; }
		.f-sec { font-size: 11px; font-weight: 600; color: #8c95a3; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
		#friends-badge { display: none; padding: 1px 6px; border-radius: 999px; background: #e6b104; color: #141824; font-size: 11px; font-weight: 700; }
		#friends-badge.show { display: inline-block; }
		.ticket-card {
			width: 420px;
			max-width: 100%;
			max-height: 85vh;
			display: flex;
			flex-direction: column;
			gap: 12px;
			background: #141824;
			border: 1px solid rgba(255, 255, 255, .14);
			border-radius: 12px;
			padding: 16px;
			color: #e6e8eb;
			font: 13.5px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			box-shadow: 0 18px 48px rgba(0, 0, 0, .6);
		}
		.ticket-head { display: flex; align-items: center; justify-content: space-between; }
		.ticket-head h3 { margin: 0; font-size: 15px; color: #fff; }
		.ticket-close { background: none; border: 1px solid rgba(255,255,255,.15); color: #aab1ba; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; }
		.ticket-form { display: flex; flex-direction: column; gap: 8px; }
		.ticket-form input, .ticket-form textarea {
			width: 100%;
			padding: 8px 10px;
			border-radius: 7px;
			border: 1px solid rgba(255, 255, 255, .14);
			background: rgba(0, 0, 0, .28);
			color: #fff;
			font: inherit;
		}
		.ticket-form textarea { min-height: 70px; resize: vertical; }
		.ticket-form button {
			padding: 8px 12px;
			border-radius: 7px;
			border: 1px solid rgba(122, 154, 214, .55);
			background: rgba(122, 154, 214, .22);
			color: #fff;
			font-weight: 600;
			cursor: pointer;
		}
		#ticket-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 240px; }
		.t-item { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 8px 10px; }
		.t-item .t-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; color: #fff; }
		.t-item .t-badge { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); text-transform: uppercase; }
		.t-item .t-badge.replied { color: #6cc083; border-color: #6cc083; }
		.t-item .t-badge.open { color: #e6b104; border-color: #e6b104; }
		.t-item .t-body { color: #cfd5de; margin-top: 4px; font-size: 12.5px; white-space: pre-wrap; }
		.t-item .t-reply { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.08); color: #9be8b0; font-size: 12.5px; }

		#shutdown-banner {
			position: fixed;
			top: 12px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 40;
			display: none;
			padding: 9px 16px;
			border-radius: 8px;
			background: rgba(160, 40, 20, .94);
			border: 1px solid rgba(255, 190, 120, .55);
			color: #fff;
			font-weight: 600;
			font-size: 13px;
			box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
			pointer-events: none;
		}
		#shutdown-banner.show { display: block; }

		/* Loading screen. The ids below are driven by js/flash.js and js/empires.js. */
		#loading_game {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #10121a center/cover no-repeat url('{{ motd | safe }}');
		}
		#loading_game .scrim { position: absolute; inset: 0; background: rgba(8, 9, 14, .55); }

		#loading_card {
			position: relative;
			width: min(560px, 86vw);
			text-align: center;
			padding: 28px 24px;
			border-radius: 12px;
			background: rgba(12, 14, 20, .72);
			border: 1px solid rgba(255, 255, 255, .12);
			backdrop-filter: blur(2px);
		}
		#loading_card img.logo { width: min(320px, 70vw); height: auto; margin-bottom: 18px; }
		#loading_message { font-size: 17px; margin: 0 0 14px; text-shadow: 0 1px 3px #000; }
		#loading_detail {
			font-size: 12px;
			color: #9aa5b5;
			margin: 10px 0 0;
			min-height: 16px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#progress_bar {
			display: flex;
			height: 10px;
			width: 72%;
			margin: 0 auto;
			border-radius: 999px;
			overflow: hidden;
			background: rgba(255, 255, 255, .14);
		}
		#inner_progress_bar {
			width: 0%;
			background: #e6b104;
			transition: width .35s ease;
		}
		#flash_enabler, #loading_gif { display: none; }
	</style>
</head>
<body>

	<div id="game_object">
		<div id="ruffle"></div>
	</div>

	<div id="shutdown-banner" role="alert"></div>
	<button id="menu-toggle" title="Profile &amp; Menu" aria-label="Profile &amp; Menu">
		<span class="chev">&lsaquo;</span>
		<img class="ava" src="{{ picture }}" alt=""/>
	</button>
	<div id="drawer-backdrop"></div>
	<aside id="drawer" aria-label="Profile &amp; Menu">
		<div class="drawer-head">
			<div class="drawer-profile">
				<img src="{{ picture }}" alt=""/>
				<div id="who-header" class="who">
					<b>{{ worldname }}</b>
					<span>Level 1</span>
				</div>
			</div>
			<button id="drawer-close" title="Close">&times;</button>
		</div>
		<div class="chat-box">
			<div class="chat-head">
				<span>World Chat</span>
				{% if is_admin %}
				<button type="button" id="chat-drop-toggle" class="chat-drop-btn">+ Drop Gift</button>
				{% endif %}
			</div>
			{% if is_admin %}
			<div id="chat-drop-form">
				<input id="cd-cash" type="number" placeholder="Cash" />
				<input id="cd-coins" type="number" placeholder="Coins" />
				<input id="cd-wood" type="number" placeholder="Wood" />
				<input id="cd-oil" type="number" placeholder="Oil" />
				<input id="cd-item" type="text" placeholder="Unit/Item (U01)" />
				<input id="cd-qty" type="number" placeholder="Qty" value="1" />
				<input id="cd-max" type="number" placeholder="Max claim (10)" value="10" style="width:100%" />
				<button type="button" id="chat-drop-send">Drop ke Chat</button>
			</div>
			{% endif %}
			<div id="chat-list"></div>
			<form class="chat-input" id="chat-form">
				<input id="chat-msg" type="text" maxlength="300" placeholder="Tulis pesan..." autocomplete="off" />
				<button type="submit">Kirim</button>
			</form>
		</div>
		<div class="drawer-actions">
			<button id="quality-toggle" type="button" title="Graphics Quality"><span>Quality</span><span id="quality-lbl">Low</span></button>
			<button id="fullscreen" title="Fullscreen"><span>Fullscreen</span><span>&#x26F6;</span></button>
			<button id="open-friends" type="button" title="Friends / Teman"><span>Friends <span id="friends-badge"></span></span><span>&#x1F465;</span></button>
			<button id="open-tickets" type="button" title="Support / Tiket"><span>Support</span><span>&#x1F3AB;</span></button>
			{% if is_admin %}
			<a href="/save-editor" title="Edit Save"><span>Edit Save</span><span>&#9998;</span></a>
			<a href="/admin" title="Admin Console"><span>Admin</span><span>&#9881;</span></a>
			{% endif %}
			<a href="/login.html" title="Switch Account"><span>Switch Acc</span><span>&#8644;</span></a>
			<a class="logout" href="#" onclick="logout(); return false" title="Logout"><span>Logout</span><span>&#x21AA;</span></a>
		</div>
	</aside>

	<div id="friends-modal" role="dialog" aria-label="Friends">
		<div class="ticket-card">
			<div class="ticket-head">
				<h3>Friends / Teman</h3>
				<button type="button" id="friends-close" class="ticket-close">&times;</button>
			</div>
			<form id="friend-add-form" class="chat-input" style="padding:0;border:0">
				<input id="friend-username" type="text" maxlength="20" placeholder="Username teman..." required />
				<button type="submit">Add Friend</button>
			</form>
			<div id="friends-status" style="font-size:12px;color:#9be8b0;min-height:14px"></div>
			<div id="friends-body" style="overflow-y:auto;max-height:290px;display:flex;flex-direction:column;gap:6px"></div>
		</div>
	</div>

	<div id="ticket-modal" role="dialog" aria-label="Support Ticket">
		<div class="ticket-card">
			<div class="ticket-head">
				<h3>Support / Tiket</h3>
				<button type="button" id="ticket-close" class="ticket-close">&times;</button>
			</div>
			<form id="ticket-form" class="ticket-form">
				<input id="tk-subject" type="text" maxlength="120" placeholder="Judul kendala / bug..." required />
				<textarea id="tk-msg" maxlength="2000" placeholder="Jelaskan detail masalah Anda..." required></textarea>
				<button type="submit">Kirim Tiket</button>
			</form>
			<div id="ticket-list"></div>
		</div>
	</div>

	<div id="loading_game">
		<div class="scrim"></div>
		<div id="loading_card">
			<img class="logo" src="img/logo.png" alt="Empires &amp; Allies"/>
			<p id="loading_message">Starting Ruffle&hellip;</p>
			<div id="progress_bar"><div id="inner_progress_bar"></div></div>
			<p id="loading_detail">Menyiapkan Ruffle WebAssembly&hellip;</p>
			<img id="loading_gif" src="img/loading.gif" alt=""/>
			<div id="flash_enabler">
				<object codebase="http://download.macromedia.com/pub/shockwave/cabs/flash/swflash.cab#version=6,0,0,0" width="300">
					<embed id="game_embed" WMODE="transparent" bgcolor="white" TYPE="application/x-shockwave-flash" PLUGINSPAGE="http://www.macromedia.com/go/getflashplayer" width="300"></embed>
				</object>
			</div>
		</div>
	</div>

	<script>
		var savedQuality = localStorage.getItem("rte_quality") || "low";
		var qLbl = document.getElementById("quality-lbl");
		if (qLbl) qLbl.textContent = savedQuality.charAt(0).toUpperCase() + savedQuality.slice(1);
		document.getElementById("quality-toggle").addEventListener("click", function () {
			var order = ["low", "medium", "high"];
			var next = order[(order.indexOf(savedQuality) + 1) % order.length];
			localStorage.setItem("rte_quality", next);
			location.reload();
		});

		(function () {
			var origFetch = window.fetch;
			var assetCount = 0;
			var skipRe = /\/(admin\/status\.json|chat\/|friends\/|support\/)/;
			window.fetch = function (input) {
				if (!window.__loadingDone) {
					var url = typeof input === "string" ? input : (input && input.url) || "";
					if (url && !skipRe.test(url)) {
						var name = url.split("?")[0].split("/").pop() || url;
						if (url.indexOf(".wasm") !== -1) {
							setLoadingStatus("Starting Ruffle...", 14, "Memuat engine Ruffle WebAssembly (" + name + ")...");
						} else if (url.indexOf("ZGame") !== -1) {
							setLoadingStatus("Loading game client...", 20, "Mengunduh " + name + "...");
						} else if (url.indexOf("gateway.php") !== -1) {
							assetCount += 1;
							setLoadingStatus(null, Math.min(95, 65 + assetCount), "Sinkronisasi data server (AMF)...");
						} else {
							assetCount += 1;
							setLoadingStatus(null, Math.min(95, 25 + assetCount * 1.5), "Memuat aset: " + name + " (" + assetCount + ")");
						}
					}
				}
				return origFetch.apply(this, arguments);
			};
		})();

		window.RufflePlayer = window.RufflePlayer || {};
		window.RufflePlayer.config = {autoplay: "on", logLevel: "error"};
		const ruffle = window.RufflePlayer.newest();
		var player = document.getElementById("ruffle").appendChild(ruffle.createPlayer());
		player.load({ // https://ruffle.rs/js-docs/master/interfaces/Config.URLLoadOptions.html
			url: "/files/empire-s.assets.zgncdn.com/assets/109338/ZGame.109338.swf",
			backgroundColor: "#10121a",
			// Must stay true: the game calls ExternalInterface.addCallback during
			// init (MessageOfTheDayManager). With this false, Ruffle throws
			// Error #2067 and startup stops at a blank screen.
			allowScriptAccess: true,
			allowFullscreen: true,
			quality: savedQuality,
			// letterbox "on" keeps the 4:3 stage undistorted in any window shape.
			letterbox: "on",
			scale: "showAll",
			parameters: 'serverTime={{time}}&is_staging=false&debugMode=false&generateSchema=0&sn_app_url=&stats=0'
		}).then(function () {
			console.info("Ruffle successfully loaded the file");
			setLoadingStatus("Initializing game...", 30, "Menjalankan SWF client...");
		}).catch(function (e) {
			console.error("Ruffle failed to load the file: " + e);
			setLoadingStatus("Gagal memuat game", null, String(e));
		});

		document.getElementById("fullscreen").addEventListener("click", function () {
			var el = document.documentElement;
			if (document.fullscreenElement) {
				document.exitFullscreen();
			} else if (el.requestFullscreen) {
				el.requestFullscreen();
			}
		});

		var drawer = document.getElementById("drawer");
		var backdrop = document.getElementById("drawer-backdrop");
		function toggleDrawer(open) {
			var show = typeof open === "boolean" ? open : !drawer.classList.contains("open");
			drawer.classList.toggle("open", show);
			backdrop.classList.toggle("open", show);
		}
		document.getElementById("menu-toggle").addEventListener("click", function () { toggleDrawer(true); });
		document.getElementById("drawer-close").addEventListener("click", function () { toggleDrawer(false); });
		backdrop.addEventListener("click", function () { toggleDrawer(false); });
		document.addEventListener("keydown", function (e) { if (e.key === "Escape") toggleDrawer(false); });

		var shutdownRemaining = null;
		function renderShutdownBanner() {
			var el = document.getElementById("shutdown-banner");
			if (!el) return;
			if (shutdownRemaining === null) {
				el.classList.remove("show");
				return;
			}
			el.textContent = "Server akan shutdown dalam " + shutdownRemaining + " detik. Harap selesaikan aksi (progress tersimpan otomatis).";
			el.classList.add("show");
		}
		setInterval(function () {
			if (shutdownRemaining !== null && shutdownRemaining > 0) {
				shutdownRemaining -= 1;
				renderShutdownBanner();
			}
		}, 1000);

		// Keep header world/level and resources (wood, iron, oil, etc.) up to date.
		function refreshHeaderResources() {
			fetch("/admin/status.json", {cache: "no-store"})
				.then(function (res) { return res.ok ? res.json() : null; })
				.then(function (s) {
					if (!s) return;
					shutdownRemaining = (s.shutdown_in !== null && s.shutdown_in !== undefined) ? s.shutdown_in : null;
					renderShutdownBanner();
					if (!s.has_session) return;
					var whoEl = document.getElementById("who-header");
					if (whoEl && s.world_name !== null) {
						whoEl.innerHTML = "<b>" + String(s.world_name).replace(/[<>&]/g, "") + "</b><span>Level " + (s.level ?? 1) + "</span>";
					}
				})
				.catch(function () {});
		}
		refreshHeaderResources();
		setInterval(refreshHeaderResources, 4000);

		var chatList = document.getElementById("chat-list");
		function loadChat() {
			fetch("/chat/messages.json", {cache: "no-store"})
				.then(function (r) { return r.ok ? r.json() : null; })
				.then(function (data) {
					if (!data || !data.messages) return;
					var atBottom = chatList.scrollHeight - chatList.scrollTop - chatList.clientHeight < 30;
					chatList.innerHTML = "";
					data.messages.forEach(function (m) {
						var div = document.createElement("div");
						div.className = "chat-msg";
						var badge = m.sender_role === "admin" ? '<span class="tag-adm">ADMIN</span>' : '';
						div.innerHTML = '<span class="meta">' + m.time + '</span>' + badge +
							'<span class="who"></span>: <span class="txt"></span>';
						div.querySelector(".who").textContent = m.sender_name;
						div.querySelector(".txt").textContent = m.message;
						if (m.drop) {
							var d = m.drop;
							var card = document.createElement("div");
							card.className = "drop-card";
							var btnText = d.already_claimed ? "Claimed" : (d.remaining <= 0 ? "Habis" : "Claim");
							var disabled = (d.already_claimed || d.remaining <= 0) ? " disabled" : "";
							card.innerHTML = '<div class="sum"></div><div class="claim-row"><span class="cnt">' +
								d.claims_count + '/' + d.max_claims + ' claimed</span><button type="button" data-drop="' +
								d.id + '"' + disabled + '>' + btnText + '</button></div>';
							card.querySelector(".sum").textContent = d.summary;
							div.appendChild(card);
						}
						chatList.appendChild(div);
					});
					if (atBottom) chatList.scrollTop = chatList.scrollHeight;
				})
				.catch(function () {});
		}

		document.getElementById("chat-form").addEventListener("submit", function (e) {
			e.preventDefault();
			var inp = document.getElementById("chat-msg");
			var txt = inp.value.trim();
			if (!txt) return;
			inp.value = "";
			fetch("/chat/send", {
				method: "POST",
				headers: {"Content-Type": "application/json"},
				body: JSON.stringify({message: txt})
			}).then(function () { loadChat(); });
		});

		chatList.addEventListener("click", function (e) {
			var btn = e.target.closest("button[data-drop]");
			if (!btn || btn.disabled) return;
			btn.disabled = true;
			fetch("/chat/claim/" + btn.dataset.drop, {method: "POST"})
				.then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
				.then(function (res) {
					if (!res.ok) {
						alert(res.j.error || "Gagal claim");
					} else {
						refreshHeaderResources();
						alert("Berhasil claim: " + res.j.summary + " (refresh game jika item/resource belum muncul di canvas)");
					}
					loadChat();
				});
		});

		var dropToggle = document.getElementById("chat-drop-toggle");
		if (dropToggle) {
			dropToggle.addEventListener("click", function () {
				document.getElementById("chat-drop-form").classList.toggle("open");
			});
			document.getElementById("chat-drop-send").addEventListener("click", function () {
				fetch("/admin/drop-gift", {
					method: "POST",
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify({
						cash: document.getElementById("cd-cash").value,
						coins: document.getElementById("cd-coins").value,
						wood: document.getElementById("cd-wood").value,
						oil: document.getElementById("cd-oil").value,
						item_code: document.getElementById("cd-item").value,
						item_count: document.getElementById("cd-qty").value,
						max_claims: document.getElementById("cd-max").value
					})
				}).then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
				.then(function (res) {
					if (!res.ok) alert(res.j.error || "Gagal drop gift");
					else {
						document.getElementById("chat-drop-form").classList.remove("open");
						loadChat();
					}
				});
			});
		}

		loadChat();
		setInterval(loadChat, 3500);

		var ticketModal = document.getElementById("ticket-modal");
		function loadTickets() {
			fetch("/support/tickets.json", {cache: "no-store"})
				.then(function (r) { return r.ok ? r.json() : null; })
				.then(function (data) {
					var list = document.getElementById("ticket-list");
					list.innerHTML = "";
					var rows = (data && data.tickets) || [];
					if (!rows.length) {
						list.innerHTML = '<div style="color:#8c95a3;font-size:12px">Belum ada tiket.</div>';
						return;
					}
					rows.forEach(function (t) {
						var item = document.createElement("div");
						item.className = "t-item";
						item.innerHTML = '<div class="t-top"><span class="t-subj"></span><span class="t-badge ' + t.status + '">' + t.status + '</span></div>' +
							'<div class="t-body"></div>' + (t.admin_reply ? '<div class="t-reply"></div>' : '');
						item.querySelector(".t-subj").textContent = "#" + t.id + " " + t.subject;
						item.querySelector(".t-body").textContent = t.message;
						if (t.admin_reply) item.querySelector(".t-reply").textContent = "Admin: " + t.admin_reply;
						list.appendChild(item);
					});
				});
		}
		document.getElementById("open-tickets").addEventListener("click", function () {
			toggleDrawer(false);
			ticketModal.classList.add("open");
			loadTickets();
		});
		document.getElementById("ticket-close").addEventListener("click", function () { ticketModal.classList.remove("open"); });
		ticketModal.addEventListener("click", function (e) { if (e.target === ticketModal) ticketModal.classList.remove("open"); });
		document.getElementById("ticket-form").addEventListener("submit", function (e) {
			e.preventDefault();
			var subj = document.getElementById("tk-subject").value.trim();
			var msg = document.getElementById("tk-msg").value.trim();
			if (!subj || !msg) return;
			fetch("/support/tickets", {
				method: "POST",
				headers: {"Content-Type": "application/json"},
				body: JSON.stringify({subject: subj, message: msg})
			}).then(function (r) {
				if (r.ok) {
					document.getElementById("tk-subject").value = "";
					document.getElementById("tk-msg").value = "";
					loadTickets();
				}
			});
		});

		var friendsModal = document.getElementById("friends-modal");
		function loadFriends() {
			fetch("/friends/list.json", {cache: "no-store"})
				.then(function (r) { return r.ok ? r.json() : null; })
				.then(function (d) {
					if (!d) return;
					var badge = document.getElementById("friends-badge");
					if (badge) {
						badge.textContent = d.incoming.length;
						badge.classList.toggle("show", d.incoming.length > 0);
					}
					var box = document.getElementById("friends-body");
					if (!box) return;
					box.innerHTML = "";
					function addSec(title, rows, kind) {
						if (!rows.length) return;
						var h = document.createElement("div");
						h.className = "f-sec";
						h.textContent = title + " (" + rows.length + ")";
						box.appendChild(h);
						rows.forEach(function (u) {
							var row = document.createElement("div");
							row.className = "f-row";
							var left = document.createElement("span");
							left.textContent = u.username + " (" + u.island_name + ")";
							var acts = document.createElement("div");
							acts.className = "f-acts";
							if (kind === "in") {
								acts.innerHTML = '<button data-fa="accept" data-fid="' + u.id + '">Acc</button>' +
									'<button class="del" data-fa="remove" data-fid="' + u.id + '">Tolak</button>';
							} else if (kind === "out") {
								acts.innerHTML = '<button class="del" data-fa="remove" data-fid="' + u.id + '">Batal</button>';
							} else {
								acts.innerHTML = '<button class="del" data-fa="remove" data-fid="' + u.id + '">Hapus</button>';
							}
							row.appendChild(left);
							row.appendChild(acts);
							box.appendChild(row);
						});
					}
					addSec("Permintaan Masuk", d.incoming, "in");
					addSec("Daftar Teman", d.friends, "fr");
					addSec("Menunggu Konfirmasi", d.outgoing, "out");
					if (!d.incoming.length && !d.friends.length && !d.outgoing.length) {
						box.innerHTML = '<div style="color:#8c95a3;font-size:12px">Belum ada teman. Masukkan username untuk mengirim request.</div>';
					}
				});
		}
		document.getElementById("open-friends").addEventListener("click", function () {
			toggleDrawer(false);
			document.getElementById("friends-status").textContent = "";
			friendsModal.classList.add("open");
			loadFriends();
		});
		document.getElementById("friends-close").addEventListener("click", function () { friendsModal.classList.remove("open"); });
		friendsModal.addEventListener("click", function (e) { if (e.target === friendsModal) friendsModal.classList.remove("open"); });
		document.getElementById("friend-add-form").addEventListener("submit", function (e) {
			e.preventDefault();
			var u = document.getElementById("friend-username").value.trim();
			if (!u) return;
			fetch("/friends/request", {
				method: "POST",
				headers: {"Content-Type": "application/json"},
				body: JSON.stringify({username: u})
			}).then(function (r) { return r.json().then(function (j) { return {ok: r.ok, j: j}; }); })
			.then(function (res) {
				var st = document.getElementById("friends-status");
				st.style.color = res.ok ? "#9be8b0" : "#f5a3a3";
				st.textContent = res.ok ? (res.j.auto_accepted ? "Otomatis berteman!" : "Friend request terkirim!") : (res.j.error || "Gagal");
				if (res.ok) document.getElementById("friend-username").value = "";
				loadFriends();
			});
		});
		document.getElementById("friends-body").addEventListener("click", function (e) {
			var btn = e.target.closest("button[data-fa]");
			if (!btn) return;
			fetch("/friends/" + btn.dataset.fid + "/" + btn.dataset.fa, {method: "POST"}).then(loadFriends);
		});
		loadFriends();

		loadingScreenUpdate();
	</script>
	<script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
	<script>
		if (typeof kofiWidgetOverlay !== 'undefined') {
			kofiWidgetOverlay.draw('sweetgin', {
				'type': 'floating-chat',
				'floating-chat.donateButton.text': 'Support me',
				'floating-chat.donateButton.background-color': '#00b9fe',
				'floating-chat.donateButton.text-color': '#fff'
			});
		}
	</script>
</body>
</html>
