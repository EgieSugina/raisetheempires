<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>Sign in &middot; Empires &amp; Allies</title>
	<link rel="shortcut icon" href="img/icon.png"/>
	<link rel="icon" type="image/png" href="img/icon.png"/>
	<link rel="stylesheet" href="{{ asset_url('css/account.css') }}"/>
</head>
<body>
	<div class="card">
		<img class="logo" src="img/logo.png" alt="Empires &amp; Allies"/>
		<h1>Sign in</h1>
		<p class="sub">Your empire is waiting, Commander.</p>

		{% if registered %}
		<div class="msg ok">Account created. Sign in to start your island.</div>
		{% endif %}
		{% if error %}
		<div class="msg error">{{ error }}</div>
		{% endif %}

		<form method="post" action="/login.html" autocomplete="on">
			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" value="{{ username | default('') }}"
				       autocomplete="username" autofocus required/>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password"
				       autocomplete="current-password" required/>
			</div>
			<button type="submit">Sign in</button>
		</form>

		<p class="alt">No account yet? <a href="/register.html">Create one</a></p>
		<p class="foot">
			Raise the Empires {{ version | default("") }}
		</p>
	</div>
</body>
</html>
